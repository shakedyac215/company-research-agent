name: Claude triage
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "Answer this comment and fix the code it describes: ${{ github.event.comment.body }}"
          claude_args: --allowedTools "Read,Edit,Bash(gh:*),Bash(python:*)"
